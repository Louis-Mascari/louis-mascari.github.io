<!DOCTYPE html>
<html lang="en" class="no-js">
  <head>
    <title>Page Not Found | Louis Mascari</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Page not found — Louis Mascari's site." />
    <meta name="theme-color" content="#0b0e12" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/modern.css" />
    <style>
      .error {
        min-height: 100vh;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 2rem;
      }
      .error-code {
        font-family: var(--mono);
        font-size: 0.72rem;
        letter-spacing: 0.1em;
        color: var(--cyan);
        margin-bottom: 1.25rem;
      }
      .error h1 {
        font-size: clamp(4rem, 2rem + 12vw, 8rem);
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 0.9;
        color: var(--signal);
        text-shadow: 0 0 40px oklch(0.82 0.155 78 / 0.35);
      }
      .error p { color: var(--ink-2); font-size: 1.1rem; margin: 1rem 0 2rem; }
    </style>
  </head>
  <body>
    <div class="error">
      <div>
        <p class="error-code">ERR · NO SIGNAL</p>
        <h1>404</h1>
        <p>That page isn't on the wire. Let's get you back.</p>
        <a href="index.html" class="btn btn-primary">Back home <span aria-hidden="true">→</span></a>
      </div>
    </div>
  </body>
</html>

<!DOCTYPE html>
<html lang="en" class="js">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You found Mango 🥭</title>
    <meta name="description" content="A small easter egg — meet Mango, Chief Morale Officer." />
    <meta name="theme-color" content="#0b0e12" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;600;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/modern.css" />
    <style>
      .mango {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1.25rem;
      }
      .mango-card {
        max-width: 460px;
        width: 100%;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: radial-gradient(120% 100% at 50% 0%, oklch(0.22 0.03 250) 0%, var(--bg-2) 70%);
        padding: 18px;
        box-shadow: 0 30px 60px -30px oklch(0 0 0 / 0.7), inset 0 1px 0 oklch(1 0 0 / 0.04);
        text-align: center;
      }
      .mango-labels {
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-family: var(--mono);
        font-size: 0.62rem;
        letter-spacing: 0.06em;
        color: var(--ink-3);
        margin-bottom: 12px;
      }
      .mango-labels .amber { font-style: normal; color: var(--signal); }
      .mango-labels .cmo { display: inline-flex; align-items: center; gap: 0.4rem; color: var(--signal); }
      .mango-labels .dot {
        width: 6px; height: 6px; border-radius: 50%;
        background: var(--signal); box-shadow: 0 0 8px var(--signal);
        animation: pulse 1.6s var(--ease) infinite;
      }
      .mango-photo {
        border-radius: var(--radius-sm);
        overflow: hidden;
        border: 1px solid var(--line);
        background: oklch(0.15 0.018 250);
      }
      .mango-photo img { width: 100%; display: block; }
      .mango-cap {
        font-family: var(--mono);
        font-size: 0.6rem;
        letter-spacing: 0.06em;
        color: var(--ink-3);
        margin-top: 10px;
        text-align: right;
      }
      .mango h1 {
        font-size: clamp(1.6rem, 1.2rem + 2vw, 2.15rem);
        font-weight: 900;
        letter-spacing: -0.02em;
        margin: 1.4rem 0 0.6rem;
      }
      .mango > .mango-card > p { color: var(--ink-2); margin-bottom: 1.6rem; }
    </style>
  </head>
  <body>
    <main class="mango">
      <div class="mango-card">
        <div class="mango-labels">
          <span>MANGO <em class="amber">◆</em></span>
          <span class="cmo"><span class="dot"></span>CMO · ON-SITE</span>
        </div>
        <div class="mango-photo">
          <img src="assets/mango.jpg" alt="Mango, the dog and Chief Morale Officer" />
        </div>
        <div class="mango-cap">mango · good girl</div>
        <h1>You found Mango 🥭</h1>
        <p>Chief Morale Officer. She doesn't know TypeScript, but her owner does.</p>
        <a href="index.html" class="btn btn-primary">See the work <span aria-hidden="true">→</span></a>
      </div>
    </main>
  </body>
</html>
